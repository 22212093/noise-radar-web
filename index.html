<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 층간소음 진원지 레이더</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #101214;
      --panel: #1b1f24;
      --panel2: #242a31;
      --line: #38414b;
      --text: #f4f7fa;
      --muted: #99a1aa;
      --green: #79ffc2;
      --red: #ff5f5f;
      --blue: #4f8cff;
      --shadow: 0 16px 38px rgba(0,0,0,0.45);
    }

    body {
      margin: 0;
      min-height: 100vh;
      height: 100vh;
      overflow: hidden;
      padding: 12px;
      background: radial-gradient(circle at top, #1b2525 0%, var(--bg) 55%);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .page {
      width: min(1180px, 100%);
      height: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 10px;
    }

    header {
      text-align: center;
      padding-top: 2px;
    }

    h1 {
      margin: 0;
      color: var(--green);
      font-size: clamp(24px, 3vw, 34px);
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .main-container {
      min-height: 0;
      display: grid;
      grid-template-columns: 430px minmax(0, 1fr);
      gap: 14px;
    }

    .panel,
    .card {
      background: rgba(27,31,36,0.96);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .left-panel {
      min-height: 0;
      padding: 14px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 82px);
      gap: 10px;
    }

    .zone {
      background: #292f36;
      border: 2px solid #454d57;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      color: #7f8790;
      position: relative;
      transition: 0.18s ease;
    }

    .node-marker {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 15px;
      height: 15px;
      background: var(--blue);
      border-radius: 50%;
      box-shadow: 0 0 14px var(--blue);
    }

    .active {
      background: #e04440 !important;
      border-color: #ff9898 !important;
      color: white !important;
      box-shadow: 0 0 28px rgba(255,70,70,0.85);
      animation: pulse 0.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.035); }
      100% { transform: scale(1); }
    }

    .room-panel {
      min-height: 0;
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #111;
    }

    .room-img {
      width: 100%;
      height: 100%;
      min-height: 230px;
      display: block;
      object-fit: cover;
    }

    .room-dim {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.20);
      pointer-events: none;
    }

    .room-grid {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      pointer-events: none;
    }

    .room-cell {
      border: 1px solid rgba(255,255,255,0.30);
      color: white;
      font-weight: 900;
      font-size: 16px;
      padding: 10px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      transition: 0.18s ease;
    }

    .room-cell.active {
      background: rgba(224,68,64,0.35) !important;
      border: 4px solid rgba(255,220,90,1) !important;
      animation: none;
    }

    .right-panel {
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 12px;
    }

    .card {
      padding: 16px 18px;
    }

    .result-box {
      border-left: 6px solid var(--green);
      line-height: 1.75;
      font-size: 17px;
    }

    .result-box span {
      color: var(--green);
      font-weight: 900;
      font-size: 21px;
    }

    .standby span {
      color: #8a929b !important;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px 18px;
    }

    .email-box textarea {
      width: 100%;
      height: 78px;
      padding: 11px;
      margin-top: 9px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #11161b;
      color: white;
      font-size: 14px;
      resize: none;
      outline: none;
    }

    .email-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .email-box button {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      background: var(--green);
      font-weight: 900;
      cursor: pointer;
      color: #0b0f0d;
      flex: 0 0 auto;
    }

    .email-status {
      color: #aab2bb;
      font-size: 13px;
      line-height: 1.45;
      word-break: break-all;
    }

    .history-panel {
      min-height: 0;
      padding: 14px 16px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .history-head h2 {
      margin: 0;
      font-size: 18px;
      color: var(--green);
    }

    .history-hint {
      color: var(--muted);
      font-size: 12px;
    }

    .table-wrapper {
      min-height: 0;
      overflow-y: auto;
      padding-right: 4px;
    }

    .table-wrapper::-webkit-scrollbar { width: 6px; }
    .table-wrapper::-webkit-scrollbar-track { background: #1e1e1e; }
    .table-wrapper::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

    .log-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      text-align: left;
    }

    .log-table th {
      color: #9da6b0;
      font-weight: 800;
      padding: 8px 0;
      border-bottom: 2px solid #343b44;
      position: sticky;
      top: 0;
      background: var(--panel);
      z-index: 1;
    }

    .log-table td {
      padding: 8px 0;
      border-bottom: 1px solid #2a3037;
      color: #d0d6dd;
    }

    .debug-bottom {
      width: 100%;
      min-height: 46px;
      max-height: 72px;
      padding: 12px 16px;
      background: rgba(21,26,31,0.98);
      border: 1px solid #333d47;
      border-radius: 14px;
      box-shadow: var(--shadow);
      color: #9ba4ad;
      font-size: 13px;
      line-height: 1.45;
      word-break: break-all;
      overflow: auto;
    }

    .ok { color: var(--green); }
    .err { color: #ff8e8e; }

    @media (max-width: 860px) {
      body {
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
        padding: 10px;
      }

      .page {
        height: auto;
        display: block;
      }

      header {
        padding: 8px 0 12px;
      }

      .main-container {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .left-panel {
        padding: 12px;
      }

      .grid-container {
        grid-template-rows: repeat(2, 74px);
        gap: 8px;
      }

      .zone {
        font-size: 21px;
      }

      .room-img {
        min-height: 220px;
        max-height: 310px;
      }

      .right-panel {
        display: grid;
        grid-template-rows: auto auto auto;
      }

      .result-grid {
        grid-template-columns: 1fr;
      }

      .email-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .email-box button {
        width: 100%;
      }

      .history-panel {
        max-height: 280px;
      }

      .debug-bottom {
        margin-top: 12px;
        max-height: 120px;
      }
    }

    @media (max-width: 420px) {
      body {
        padding: 8px;
      }

      h1 {
        font-size: 23px;
      }

      .subtitle {
        font-size: 12px;
      }

      .grid-container {
        grid-template-rows: repeat(2, 66px);
      }

      .zone {
        font-size: 19px;
        border-radius: 12px;
      }

      .node-marker {
        width: 12px;
        height: 12px;
        top: 6px;
        right: 6px;
      }

      .card,
      .history-panel,
      .left-panel {
        padding: 12px;
      }

      .result-box span {
        font-size: 19px;
      }

      .room-cell {
        font-size: 13px;
        padding: 8px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <h1>🚨 AI 층간소음 진원지 레이더</h1>
      <p class="subtitle">150cm x 100cm 실시간 관제 및 로그 시스템</p>
    </header>

    <main class="main-container">
      <section class="panel left-panel">
        <div class="grid-container" aria-label="실시간 위치 표시">
          <div id="z1" class="zone">P1<div class="node-marker"></div></div>
          <div id="z2" class="zone">P2</div>
          <div id="z3" class="zone">P3<div class="node-marker"></div></div>
          <div id="z4" class="zone">P4<div class="node-marker"></div></div>
          <div id="z5" class="zone">P5</div>
          <div id="z6" class="zone">P6<div class="node-marker"></div></div>
        </div>

        <div class="room-panel">
          <img class="room-img" src="room.png" alt="방 구조 이미지" />
          <div class="room-dim"></div>
          <div class="room-grid" aria-hidden="true">
            <div id="rz1" class="room-cell">P1</div>
            <div id="rz2" class="room-cell">P2</div>
            <div id="rz3" class="room-cell">P3</div>
            <div id="rz4" class="room-cell">P4</div>
            <div id="rz5" class="room-cell">P5</div>
            <div id="rz6" class="room-cell">P6</div>
          </div>
        </div>
      </section>

      <section class="right-panel">
        <div id="resultBox" class="card result-box standby">
          <div class="result-grid">
            <div>📍 진원지: <span id="resZone">대기중</span></div>
            <div>🔊 소음원: <span id="resSound">대기중</span></div>
            <div>🎯 정확도: <span id="resAcc">0</span>%</div>
            <div>🧩 클래스: <span id="resClass">STANDBY</span></div>
          </div>
        </div>

        <div class="card email-box">
          <b>📧 알림 받을 이메일 여러 명 입력</b>
          <textarea id="emailInput" placeholder="a@gmail.com
b@gmail.com
c@gmail.com

또는 a@gmail.com, b@gmail.com"></textarea>
          <div class="email-actions">
            <button onclick="saveEmails()">저장</button>
            <div id="emailStatus" class="email-status">이메일 설정 확인 중...</div>
          </div>
        </div>

        <div class="panel history-panel">
          <div class="history-head">
            <h2>📋 최근 발생 이력 로그</h2>
            <div class="history-hint">최신 감지 순서로 표시</div>
          </div>
          <div class="table-wrapper">
            <table class="log-table">
              <thead>
                <tr>
                  <th width="34%">시간</th>
                  <th width="18%">위치</th>
                  <th width="48%">소음 종류</th>
                </tr>
              </thead>
              <tbody id="logBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <div id="debugBox" class="debug-bottom">Firebase REST 연결 대기 중...</div>
  </div>

  <script>
    const DB_URL = "https://noiseradar-8886e-default-rtdb.firebaseio.com";
    const STATUS_URL = DB_URL + "/current_status.json";
    const EMAIL_URL = DB_URL + "/settings/email_to.json";
    const LOG_URL = DB_URL + "/recent_logs.json";

    const ACTIVE_HOLD_MS = 600000;
    const MAX_LOG_ROWS = 10;

    const debugBox = document.getElementById("debugBox");
    const logBody = document.getElementById("logBody");
    const resultBox = document.getElementById("resultBox");

    let lastActiveData = null;
    const renderedLogKeys = new Set();

    function setDebug(msg, isError) {
      debugBox.className = isError ? "debug-bottom err" : "debug-bottom ok";
      debugBox.innerText = msg;
      console.log(msg);
    }

    function clearZones() {
      for (let i = 1; i <= 6; i++) {
        const zone = document.getElementById("z" + i);
        const roomZone = document.getElementById("rz" + i);
        if (zone) zone.classList.remove("active");
        if (roomZone) roomZone.classList.remove("active");
      }
    }

    function activateZone(zone) {
      const zoneEl = document.getElementById("z" + zone);
      const roomZoneEl = document.getElementById("rz" + zone);

      if (zoneEl) zoneEl.classList.add("active");
      if (roomZoneEl) roomZoneEl.classList.add("active");
    }

    function setStandby() {
      clearZones();
      resultBox.classList.add("standby");
      document.getElementById("resZone").innerText = "대기중";
      document.getElementById("resSound").innerText = "대기중";
      document.getElementById("resAcc").innerText = "0";
      document.getElementById("resClass").innerText = "STANDBY";
    }

    function parseEmails(text) {
      const raw = String(text || "");
      const parts = raw.split(/[\n,;]/);
      const emails = [];

      for (const p of parts) {
        const e = p.trim();
        if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) {
          if (!emails.includes(e)) emails.push(e);
        }
      }

      return emails;
    }

    async function saveEmails() {
      const raw = document.getElementById("emailInput").value;
      const emails = parseEmails(raw);

      if (emails.length === 0) {
        document.getElementById("emailStatus").innerText = "이메일을 1개 이상 올바르게 입력";
        return;
      }

      try {
        const payload = {
          emails: emails,
          updatedAt: Date.now()
        };

        const res = await fetch(EMAIL_URL, {
          method: "PUT",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const txt = await res.text();
          document.getElementById("emailStatus").innerText = "저장 실패: " + txt;
          return;
        }

        document.getElementById("emailStatus").innerText =
          "저장됨 (" + emails.length + "명): " + emails.join(", ");
      } catch (err) {
        document.getElementById("emailStatus").innerText = "저장 오류: " + err.message;
      }
    }

    async function loadEmails() {
      try {
        const res = await fetch(EMAIL_URL + "?t=" + Date.now(), { cache: "no-store" });

        if (!res.ok) {
          document.getElementById("emailStatus").innerText = "이메일 설정 읽기 실패";
          return;
        }

        const data = await res.json();

        if (data && Array.isArray(data.emails)) {
          document.getElementById("emailInput").value = data.emails.join("\n");
          document.getElementById("emailStatus").innerText =
            "현재 수신 이메일 (" + data.emails.length + "명): " + data.emails.join(", ");
        } else if (data && data.email) {
          document.getElementById("emailInput").value = data.email;
          document.getElementById("emailStatus").innerText =
            "현재 수신 이메일: " + data.email;
        } else {
          document.getElementById("emailStatus").innerText = "이메일 미설정";
        }
      } catch (err) {
        document.getElementById("emailStatus").innerText = "이메일 설정 오류: " + err.message;
      }
    }

    function formatTime(data) {
      return data.timeText || new Date().toLocaleTimeString("ko-KR", {
        hour12: false,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function addLog(data, forceKey) {
      if (!data || Number(data.zone) <= 0) return;

      const ts = Number(data.timestamp || Date.now());
      const key = forceKey || String(ts) + "_" + String(data.zone) + "_" + String(data.sound || data.noise || "");

      if (renderedLogKeys.has(key)) return;
      renderedLogKeys.add(key);

      const sound = data.sound || data.noise || data.noiseType || "-";
      const acc = data.accuracy ?? data.confidence ?? 0;

      const row = document.createElement("tr");
      row.innerHTML =
        "<td>" + formatTime(data) + "</td>" +
        "<td><b style='color:#79ffc2;'>P" + data.zone + "</b></td>" +
        "<td>" + sound + " (" + acc + "%)</td>";

      logBody.insertBefore(row, logBody.firstChild);

      while (logBody.children.length > MAX_LOG_ROWS) {
        logBody.removeChild(logBody.lastChild);
      }
    }

    async function loadRecentLogs() {
      try {
        const res = await fetch(LOG_URL + "?orderBy=\"timestamp\"&limitToLast=" + MAX_LOG_ROWS + "&t=" + Date.now(), {
          cache: "no-store"
        });

        if (!res.ok) return;

        const data = await res.json();
        if (!data) return;

        const rows = Object.entries(data)
          .map(([key, value]) => ({ key, value }))
          .sort((a, b) => Number(a.value.timestamp || 0) - Number(b.value.timestamp || 0));

        for (const item of rows) {
          addLog(item.value, item.key);
        }
      } catch (err) {
        console.log("recent_logs load error:", err.message);
      }
    }

    function isRecent(data) {
      if (!data || Number(data.zone) <= 0) return false;
      const ts = Number(data.timestamp || 0) * 1000;
      if (!ts) return false;
      return Date.now() - ts <= ACTIVE_HOLD_MS;
    }

    function renderStatus(data) {
      if (data && Number(data.zone) > 0) {
        addLog(data);
      }

      if (!isRecent(data)) {
        setStandby();
        return;
      }

      lastActiveData = data;
      clearZones();

      const zone = Number(data.zone);
      activateZone(zone);

      resultBox.classList.remove("standby");
      document.getElementById("resZone").innerText = "P" + zone;
      document.getElementById("resSound").innerText = data.sound || data.noise || data.noiseType || "-";
      document.getElementById("resAcc").innerText = data.accuracy ?? data.confidence ?? 0;
      document.getElementById("resClass").innerText = data.class_id || data.label || "-";
    }

    async function pollStatus() {
      try {
        const res = await fetch(STATUS_URL + "?t=" + Date.now(), {
          cache: "no-store"
        });

        if (!res.ok) {
          const txt = await res.text();
          setDebug("Firebase REST 읽기 실패: HTTP " + res.status + " / " + txt, true);
          return;
        }

        const data = await res.json();
        setDebug("current_status 수신: " + JSON.stringify(data), false);
        renderStatus(data);
      } catch (err) {
        setDebug("Firebase REST 연결 오류: " + err.message, true);
      }
    }

    loadEmails();
    loadRecentLogs();
    pollStatus();
    setInterval(pollStatus, 1000);

    setInterval(() => {
      if (lastActiveData && !isRecent(lastActiveData)) {
        setStandby();
      }
    }, 500);
  </script>
</body>
</html>
