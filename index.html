<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨 AI 층간소음 진원지 레이더 및 로그 시스템</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        h1 { color: #00ffcc; margin-bottom: 5px; font-size: 28px; letter-spacing: 1px; margin-top: 10px; text-align: center; }
        p { color: #888; margin-bottom: 30px; font-size: 15px; text-align: center; }
        
        /* 🔥 좌우 분할을 위한 메인 컨테이너 (기본 PC/태블릿 모드) */
        .main-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            gap: 50px;
            max-width: 1000px;
            width: 100%;
        }

        /* 왼쪽 패널: 도면 + 결과창 */
        .left-panel { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 370px; }
        
        .grid-container {
            display: grid; grid-template-columns: repeat(3, 110px); grid-template-rows: repeat(2, 110px); gap: 20px;
            background-color: #1e1e1e; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            margin-bottom: 25px; justify-content: center;
        }
        
        .zone { background-color: #2c2c2c; border: 2px solid #444; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; color: #555; position: relative; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .node-marker { position: absolute; top: 6px; right: 6px; width: 14px; height: 14px; background-color: #0088ff; border-radius: 50%; box-shadow: 0 0 10px #0088ff; }
        .active { background-color: #ff3333 !important; border-color: #ff6666 !important; color: white !important; box-shadow: 0 0 25px #ff3333; animation: pulse 0.8s infinite; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }

        .result-box {
            width: 100%; padding: 20px 25px; background-color: #1e1e1e; border-left: 6px solid #00ffcc;
            border-radius: 8px; font-size: 16px; line-height: 1.6; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            display: none; box-sizing: border-box;
        }
        .result-box span { color: #00ffcc; font-weight: bold; font-size: 20px; }

        /* 오른쪽 패널: 로그 테이블 */
        .right-panel {
            width: 100%; max-width: 400px; background-color: #1e1e1e; border-radius: 12px; padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); box-sizing: border-box;
        }
        .right-panel h2 { font-size: 18px; color: #00ffcc; margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .log-table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
        .log-table th { color: #888; font-weight: 600; padding-bottom: 10px; border-bottom: 2px solid #333; }
        .log-table td { padding: 10px 0; border-bottom: 1px solid #222; color: #ccc; }
        .log-table tr:first-child td { color: #ff6666; font-weight: bold; }

        /* 📱 모바일 화면(스마트폰)을 위한 반응형 CSS 추가 */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column; /* 가로 배열을 세로 배열로 변경 */
                align-items: center;
                gap: 20px; /* 패널 사이 간격 줄임 */
            }
            .grid-container {
                grid-template-columns: repeat(3, 90px); /* 폰 화면에 맞춰 그리드 살짝 축소 */
                grid-template-rows: repeat(2, 90px);
                padding: 20px;
                gap: 15px;
            }
            .zone { font-size: 22px; }
            .right-panel { max-width: 370px; } /* 로그 창도 왼쪽 도면 창이랑 크기 맞춤 */
        }
    </style>
</head>
<body>

    <h1>🚨 AI 층간소음 진원지 레이더</h1>
    <p>150cm x 100cm 실시간 관제 및 로그 시스템</p>

    <div class="main-container">
        <div class="left-panel">
            <div class="grid-container">
                <div id="z1" class="zone">P1<div class="node-marker"></div></div>
                <div id="z2" class="zone">P2</div>
                <div id="z3" class="zone">P3<div class="node-marker"></div></div>
                <div id="z4" class="zone">P4<div class="node-marker"></div></div>
                <div id="z5" class="zone">P5</div>
                <div id="z6" class="zone">P6<div class="node-marker"></div></div>
            </div>

            <div id="resultBox" class="result-box">
                📍 진원지: <span id="resZone">P-</span> 구역<br>
                🔊 소음원: <span id="resSound">대기 중</span><br>
                🎯 정확도: <span id="resAcc">0</span>%
            </div>
        </div>

        <div class="right-panel">
            <h2>📋 최근 발생 이력 로그</h2>
            <table class="log-table">
                <thead>
                    <tr>
                        <th width="30%">시간</th>
                        <th width="20%">위치</th>
                        <th width="50%">소음 종류</th>
                    </tr>
                </thead>
                <tbody id="logBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://noiseradar-8886e-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('current_status').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.zone > 0) {
                for(let i=1; i<=6; i++) document.getElementById('z'+i).classList.remove('active');
                document.getElementById('z' + data.zone).classList.add('active');
                
                document.getElementById('resZone').innerText = 'P' + data.zone;
                document.getElementById('resSound').innerText = data.sound;
                document.getElementById('resAcc').innerText = data.accuracy;
                document.getElementById('resultBox').style.display = 'block';

                const logBody = document.getElementById('logBody');
                const now = new Date();
                const timeString = now.toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                
                const newRow = document.createElement('tr');
                newRow.innerHTML = `<td>${timeString}</td><td><b style="color: #00ffcc;">P${data.zone}</b></td><td>${data.sound} (${data.accuracy}%)</td>`;
                
                logBody.insertBefore(newRow, logBody.firstChild);
                if (logBody.children.length > 8) logBody.removeChild(logBody.lastChild);
            } else {
                for(let i=1; i<=6; i++) document.getElementById('z'+i).classList.remove('active');
                document.getElementById('resultBox').style.display = 'none';
            }
        });
    </script>
</body>
</html>
