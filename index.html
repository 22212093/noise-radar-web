<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>층간소음 레이더 관제 시스템</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        h1 { color: #00ffcc; margin-bottom: 5px; font-size: 28px; letter-spacing: 1px; }
        p { color: #888; margin-bottom: 30px; font-size: 14px; }
        
        /* 3x2 실전 테스트베드 그리드 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            grid-template-rows: repeat(2, 110px);
            gap: 20px;
            background-color: #1e1e1e;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        
        .zone {
            background-color: #2c2c2c;
            border: 2px solid #444;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            color: #555;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 4개 모서리 앵커 노드 물리적 마커 표시 */
        .node-marker {
            position: absolute;
            top: 6px; right: 6px;
            width: 14px; height: 14px;
            background-color: #0088ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #0088ff;
        }

        /* 소음원 탐지 시 실시간 시각 알림 활성화 효과 */
        .active {
            background-color: #ff3333 !important;
            border-color: #ff6666 !important;
            color: white !important;
            box-shadow: 0 0 25px #ff3333;
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        /* 결과 분석 디스플레이 팝업 보드 */
        .result-box {
            margin-top: 35px;
            padding: 20px 35px;
            background-color: #1e1e1e;
            border-left: 6px solid #00ffcc;
            border-radius: 8px;
            font-size: 18px;
            line-height: 1.6;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            display: none;
        }
        .result-box span { color: #00ffcc; font-weight: bold; font-size: 24px; }
    </style>
</head>
<body>

    <h1>🚨 AI 층간소음 진원지 레이더</h1>
    <p>150cm x 100cm 실시간 관제 시스템</p>

    <div class="grid-container">
        <div id="z4" class="zone">P4<div class="node-marker"></div></div>
        <div id="z5" class="zone">P5</div>
        <div id="z6" class="zone">P6<div class="node-marker"></div></div>
        
        <div id="z1" class="zone">P1<div class="node-marker"></div></div>
        <div id="z2" class="zone">P2</div>
        <div id="z3" class="zone">P3<div class="node-marker"></div></div>
    </div>

    <div id="resultBox" class="result-box">
        📍 발생 진원지: <span id="resZone">P-</span> 구역<br>
        🔊 소음원 분류: <span id="resSound">분석 중</span> 감지<br>
        🎯 모델 정확도: <span id="resAcc">0</span>%
    </div>

    <script>
        // 파이어베이스 Realtime Database 실시간 연동 세팅 완료
        const firebaseConfig = {
            databaseURL: "https://noiseradar-8886e-default-rtdb.firebaseio.com/"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 파이어베이스의 current_status 노드를 실시간 리스닝(구독)
        db.ref('current_status').on('value', (snapshot) => {
            const data = snapshot.val();
            
            if (data && data.zone > 0) {
                // 기존 활성화 클래스 전체 초기화
                for(let i=1; i<=6; i++) {
                    document.getElementById('z'+i).classList.remove('active');
                }
                // 실시간 위치 추정 구역 하이라이팅 활성화
                document.getElementById('z' + data.zone).classList.add('active');
                
                // 프론트엔드 계측 보드 실시간 데이터 반영
                document.getElementById('resZone').innerText = 'P' + data.zone;
                document.getElementById('resSound').innerText = data.sound;
                document.getElementById('resAcc').innerText = data.accuracy;
                document.getElementById('resultBox').style.display = 'block';
            } else {
                // zone이 0이거나 데이터가 비었으면 대기 상태로 자동 복귀
                for(let i=1; i<=6; i++) {
                    document.getElementById('z'+i).classList.remove('active');
                }
                document.getElementById('resultBox').style.display = 'none';
            }
        });
    </script>
</body>
</html>
