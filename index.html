<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨 AI 층간소음 진원지 레이더 및 로그 시스템</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: white; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        h1 { color: #00ffcc; margin-bottom: 5px; font-size: 26px; letter-spacing: 1px; margin-top: 10px; }
        p { color: #888; margin-bottom: 20px; font-size: 14px; }
        
        /* 3x2 그리드 배열 (정상화 완료: 1 2 3 / 4 5 6) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            grid-template-rows: repeat(2, 110px);
            gap: 20px;
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            margin-bottom: 25px;
        }
        
        .zone {
            background-color: #2c2c2c;
            border: 2px solid #444;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            color: #555;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .node-marker {
            position: absolute;
            top: 6px; right: 6px;
            width: 14px; height: 14px;
            background-color: #0088ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #0088ff;
        }

        .active {
            background-color: #ff3333 !important;
            border-color: #ff6666 !important;
            color: white !important;
            box-shadow: 0 0 25px #ff3333;
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        /* 결과 알림 보드 */
        .result-box {
            width: 370px;
            padding: 15px 25px;
            background-color: #1e1e1e;
            border-left: 6px solid #00ffcc;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.6;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            margin-bottom: 25px;
            display: none;
            box-sizing: border-box;
        }
        .result-box span { color: #00ffcc; font-weight: bold; font-size: 20px; }

        /* 🔥 실시간 로그 테이블 스타일 */
        .log-container {
            width: 370px;
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        .log-container h2 { font-size: 16px; color: #00ffcc; margin-top: 0; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .log-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        .log-table th { color: #888; font-weight: 600; padding-bottom: 8px; border-bottom: 2px solid #333; }
        .log-table td { padding: 8px 0; border-bottom: 1px solid #222; color: #ccc; }
        .log-table tr:first-child td { color: #ff6666; font-weight: bold; } /* 최근 로그 하이라이트 */
    </style>
</head>
<body>

    <h1>🚨 AI 층간소음 진원지 레이더</h1>
    <p>150cm x 100cm 실시간 관제 및 로그 시스템</p>

    <div class="grid-container">
        <div id="z1" class="zone">P1<div class="node-marker"></div></div>
        <div id="z2" class="zone">P2</div>
        <div id="z3" class="zone">P3<div class="node-marker"></div></div>
        
        <div id="z4" class="zone">P4<div class="node-marker"></div></div>
        <div id="z5" class="zone">P5</div>
        <div id="z6" class="zone">P6<div class="node-marker"></div></div>
    </div>

    <div id="resultBox" class="result-box">
        📍 발생 진원지: <span id="resZone">P-</span> 구역<br>
        🔊 소음원 분류: <span id="resSound">분석 중</span> 감지<br>
        🎯 모델 정확도: <span id="resAcc">0</span>%
    </div>

    <div class="log-container">
        <h2>📋 최근 소음 발생 이력 로그</h2>
        <table class="log-table">
            <thead>
                <tr>
                    <th width="25%">시간</th>
                    <th width="25%">위치</th>
                    <th width="50%">소음 종류 (정확도)</th>
                </tr>
            </thead>
            <tbody id="logBody">
                </tbody>
        </table>
    </div>

    <script>
        // 파이어베이스 완전 매핑
        const firebaseConfig = {
            databaseURL: "https://noiseradar-8886e-default-rtdb.firebaseio.com/"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 실시간 리스닝 규칙
        db.ref('current_status').on('value', (snapshot) => {
            const data = snapshot.val();
            
            if (data && data.zone > 0) {
                // 1. 기존 그리드 액티브 초기화 후 해당 구역 빨간불 켜기
                for(let i=1; i<=6; i++) {
                    document.getElementById('z'+i).classList.remove('active');
                }
                document.getElementById('z' + data.zone).classList.add('active');
                
                // 2. 알림창 데이터 반영
                document.getElementById('resZone').innerText = 'P' + data.zone;
                document.getElementById('resSound').innerText = data.sound;
                document.getElementById('resAcc').innerText = data.accuracy;
                document.getElementById('resultBox').style.display = 'block';

                // 3. 🔥 진원지 로그 시스템: 새로운 소음 데이터 테이블에 행(Row) 추가
                const logBody = document.getElementById('logBody');
                const now = new Date();
                const timeString = now.toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                
                // 새로운 로그 행 생성
                const newRow = document.createElement('tr');
                newRow.innerHTML = `
                    <td>${timeString}</td>
                    <td><b style="color: #00ffcc;">P${data.zone}</b></td>
                    <td>${data.sound} (${data.accuracy}%)</td>
                `;
                
                // 최신 로그가 맨 위로 오도록 추가
                logBody.insertBefore(newRow, logBody.firstChild);

                // 로그가 너무 많아지면 스크롤이 터지니까 최근 5개만 유지하도록 커트
                if (logBody.children.length > 5) {
                    logBody.removeChild(logBody.lastChild);
                }
            } else {
                // 라파에서 리셋 신호(zone=0)가 오면 그리드 빨간불만 끄고 알림창 숨김 (로그는 유지!)
                for(let i=1; i<=6; i++) {
                    document.getElementById('z'+i).classList.remove('active');
                }
                document.getElementById('resultBox').style.display = 'none';
            }
        });
    </script>
</body>
</html>
