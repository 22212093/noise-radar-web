<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 층간소음 진원지 레이더</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      color: #79ffc2;
      margin-bottom: 5px;
      font-size: 34px;
      letter-spacing: 1px;
      margin-top: 20px;
      text-align: center;
    }

    p {
      color: #999;
      margin-bottom: 25px;
      font-size: 16px;
      text-align: center;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 780px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(2, 110px);
      gap: 20px;
      background-color: #1f1f1f;
      padding: 30px;
      border-radius: 22px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.65);
      margin-bottom: 25px;
    }

    .zone {
      background-color: #2b2b2b;
      border: 2px solid #444;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: bold;
      color: #555;
      position: relative;
      transition: 0.25s;
    }

    .node-marker {
      position: absolute;
      top: 9px;
      right: 9px;
      width: 18px;
      height: 18px;
      background-color: #4f8cff;
      border-radius: 50%;
      box-shadow: 0 0 14px #4f8cff;
    }

    .active {
      background-color: #e04440 !important;
      border-color: #ff7777 !important;
      color: white !important;
      box-shadow: 0 0 30px rgba(255, 70, 70, 0.9);
      animation: pulse 0.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 22px;
      background-color: #1f1f1f;
      border-radius: 12px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.35);
      box-sizing: border-box;
      margin-bottom: 18px;
    }

    .result-box {
      border-left: 6px solid #79ffc2;
      font-size: 18px;
      line-height: 1.8;
      display: block;
    }

    .result-box span {
      color: #79ffc2;
      font-weight: bold;
      font-size: 22px;
    }

    .standby span {
      color: #888 !important;
    }

    .email-box textarea {
      width: 96%;
      height: 85px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 15px;
      resize: vertical;
      box-sizing: border-box;
    }

    .email-box button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #79ffc2;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .email-status {
      margin-top: 10px;
      color: #aaa;
      font-size: 14px;
      word-break: break-all;
      line-height: 1.5;
    }

    .right-panel h2 {
      font-size: 22px;
      color: #79ffc2;
      margin: 0 0 16px 0;
      border-bottom: 1px solid #333;
      padding-bottom: 12px;
    }

    .table-wrapper {
      max-height: 230px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .table-wrapper::-webkit-scrollbar { width: 6px; }
    .table-wrapper::-webkit-scrollbar-track { background: #1e1e1e; }
    .table-wrapper::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

    .log-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
      text-align: left;
    }

    .log-table th {
      color: #999;
      font-weight: 600;
      padding: 10px 0;
      border-bottom: 2px solid #333;
      position: sticky;
      top: 0;
      background-color: #1f1f1f;
      z-index: 1;
    }

    .log-table td {
      padding: 10px 0;
      border-bottom: 1px solid #2a2a2a;
      color: #ccc;
    }

    .debug-box {
      width: 100%;
      max-width: 720px;
      margin-top: 10px;
      padding: 14px 18px;
      background: #181818;
      border: 1px solid #333;
      border-radius: 8px;
      color: #999;
      font-size: 14px;
      word-break: break-all;
      box-sizing: border-box;
    }

    .ok { color: #79ffc2; }
    .err { color: #ff7777; }
  </style>
</head>

<body>
  <h1>🚨 AI 층간소음 진원지 레이더</h1>
  <p>150cm x 100cm 실시간 관제 및 로그 시스템</p>

  <div class="main-container">
    <div class="grid-container">
      <div id="z1" class="zone">P1<div class="node-marker"></div></div>
      <div id="z2" class="zone">P2</div>
      <div id="z3" class="zone">P3<div class="node-marker"></div></div>
      <div id="z4" class="zone">P4<div class="node-marker"></div></div>
      <div id="z5" class="zone">P5</div>
      <div id="z6" class="zone">P6<div class="node-marker"></div></div>
    </div>

    <div id="resultBox" class="card result-box standby">
      📍 진원지: <span id="resZone">대기중</span><br>
      🔊 소음원: <span id="resSound">대기중</span><br>
      🎯 정확도: <span id="resAcc">0</span>%<br>
      🧩 클래스: <span id="resClass">STANDBY</span>
    </div>

    <div class="card email-box">
      <b>📧 알림 받을 이메일 여러 명 입력</b><br>
      <textarea id="emailInput" placeholder="a@gmail.com
b@gmail.com
c@gmail.com

또는 a@gmail.com, b@gmail.com"></textarea>
      <br>
      <button onclick="saveEmails()">저장</button>
      <div id="emailStatus" class="email-status">이메일 설정 확인 중...</div>
    </div>

    <div class="card right-panel">
      <h2>📋 최근 발생 이력 로그</h2>
      <div class="table-wrapper">
        <table class="log-table">
          <thead>
            <tr>
              <th width="30%">시간</th>
              <th width="20%">위치</th>
              <th width="50%">소음 종류</th>
            </tr>
          </thead>
          <tbody id="logBody"></tbody>
        </table>
      </div>
    </div>

    <div id="debugBox" class="debug-box">Firebase REST 연결 대기 중...</div>
  </div>

  <script>
    const DB_URL = "https://noiseradar-8886e-default-rtdb.firebaseio.com";
    const STATUS_URL = DB_URL + "/current_status.json";
    const EMAIL_URL = DB_URL + "/settings/email_to.json";

    const ACTIVE_HOLD_MS = 8000;
    const MAX_LOG_ROWS = 10;

    const debugBox = document.getElementById("debugBox");
    const logBody = document.getElementById("logBody");
    const resultBox = document.getElementById("resultBox");

    let lastTimestamp = 0;
    let lastActiveData = null;

    function setDebug(msg, isError) {
      debugBox.className = isError ? "debug-box err" : "debug-box ok";
      debugBox.innerText = msg;
      console.log(msg);
    }

    function clearZones() {
      for (let i = 1; i <= 6; i++) {
        document.getElementById("z" + i).classList.remove("active");
      }
    }

    function setStandby() {
      clearZones();
      resultBox.classList.add("standby");
      document.getElementById("resZone").innerText = "대기중";
      document.getElementById("resSound").innerText = "대기중";
      document.getElementById("resAcc").innerText = "0";
      document.getElementById("resClass").innerText = "STANDBY";
    }

    function parseEmails(text) {
      const raw = String(text || "");
      const parts = raw.split(/[\n,;]/);
      const emails = [];

      for (const p of parts) {
        const e = p.trim();
        if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) {
          if (!emails.includes(e)) emails.push(e);
        }
      }

      return emails;
    }

    async function saveEmails() {
      const raw = document.getElementById("emailInput").value;
      const emails = parseEmails(raw);

      if (emails.length === 0) {
        document.getElementById("emailStatus").innerText = "이메일을 1개 이상 올바르게 입력";
        return;
      }

      try {
        const payload = {
          emails: emails,
          updatedAt: Date.now()
        };

        const res = await fetch(EMAIL_URL, {
          method: "PUT",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const txt = await res.text();
          document.getElementById("emailStatus").innerText = "저장 실패: " + txt;
          return;
        }

        document.getElementById("emailStatus").innerText =
          "저장됨 (" + emails.length + "명): " + emails.join(", ");
      } catch (err) {
        document.getElementById("emailStatus").innerText = "저장 오류: " + err.message;
      }
    }

    async function loadEmails() {
      try {
        const res = await fetch(EMAIL_URL + "?t=" + Date.now(), { cache: "no-store" });

        if (!res.ok) {
          document.getElementById("emailStatus").innerText = "이메일 설정 읽기 실패";
          return;
        }

        const data = await res.json();

        if (data && Array.isArray(data.emails)) {
          document.getElementById("emailInput").value = data.emails.join("\n");
          document.getElementById("emailStatus").innerText =
            "현재 수신 이메일 (" + data.emails.length + "명): " + data.emails.join(", ");
        } else if (data && data.email) {
          document.getElementById("emailInput").value = data.email;
          document.getElementById("emailStatus").innerText =
            "현재 수신 이메일: " + data.email;
        } else {
          document.getElementById("emailStatus").innerText = "이메일 미설정";
        }
      } catch (err) {
        document.getElementById("emailStatus").innerText = "이메일 설정 오류: " + err.message;
      }
    }

    function addLog(data) {
      if (!data || Number(data.zone) <= 0) return;

      const ts = Number(data.timestamp || Date.now());
      if (ts === lastTimestamp) return;
      lastTimestamp = ts;

      const timeString = data.timeText || new Date().toLocaleTimeString("ko-KR", {
        hour12: false,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });

      const sound = data.sound || data.noise || data.noiseType || "-";
      const acc = data.accuracy ?? data.confidence ?? 0;

      const row = document.createElement("tr");
      row.innerHTML =
        "<td>" + timeString + "</td>" +
        "<td><b style='color:#79ffc2;'>P" + data.zone + "</b></td>" +
        "<td>" + sound + " (" + acc + "%)</td>";

      logBody.insertBefore(row, logBody.firstChild);

      while (logBody.children.length > MAX_LOG_ROWS) {
        logBody.removeChild(logBody.lastChild);
      }
    }

    function isRecent(data) {
      if (!data || Number(data.zone) <= 0) return false;
      const ts = Number(data.timestamp || 0) * 1000;
      if (!ts) return false;
      return Date.now() - ts <= ACTIVE_HOLD_MS;
    }

    function renderStatus(data) {
      if (data && Number(data.zone) > 0) {
        addLog(data);
      }

      if (!isRecent(data)) {
        setStandby();
        return;
      }

      lastActiveData = data;

      clearZones();

      const zone = Number(data.zone);
      const zoneEl = document.getElementById("z" + zone);

      if (zoneEl) zoneEl.classList.add("active");

      resultBox.classList.remove("standby");
      document.getElementById("resZone").innerText = "P" + zone;
      document.getElementById("resSound").innerText = data.sound || data.noise || data.noiseType || "-";
      document.getElementById("resAcc").innerText = data.accuracy ?? data.confidence ?? 0;
      document.getElementById("resClass").innerText = data.class_id || data.label || "-";
    }

    async function pollStatus() {
      try {
        const res = await fetch(STATUS_URL + "?t=" + Date.now(), {
          cache: "no-store"
        });

        if (!res.ok) {
          const txt = await res.text();
          setDebug("Firebase REST 읽기 실패: HTTP " + res.status + " / " + txt, true);
          return;
        }

        const data = await res.json();
        setDebug("current_status 수신: " + JSON.stringify(data), false);
        renderStatus(data);
      } catch (err) {
        setDebug("Firebase REST 연결 오류: " + err.message, true);
      }
    }

    loadEmails();
    pollStatus();
    setInterval(pollStatus, 1000);

    setInterval(() => {
      if (lastActiveData && !isRecent(lastActiveData)) {
        setStandby();
      }
    }, 500);
  </script>
</body>
</html>
