<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 층간소음 진원지 레이더</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      color: #79ffc2;
      margin-bottom: 5px;
      font-size: 34px;
      letter-spacing: 1px;
      margin-top: 20px;
      text-align: center;
    }

    p {
      color: #999;
      margin-bottom: 30px;
      font-size: 16px;
      text-align: center;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 780px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(2, 110px);
      gap: 20px;
      background-color: #1f1f1f;
      padding: 30px;
      border-radius: 22px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.65);
      margin-bottom: 30px;
    }

    .zone {
      background-color: #2b2b2b;
      border: 2px solid #444;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: bold;
      color: #555;
      position: relative;
      transition: 0.25s;
    }

    .node-marker {
      position: absolute;
      top: 9px;
      right: 9px;
      width: 18px;
      height: 18px;
      background-color: #4f8cff;
      border-radius: 50%;
      box-shadow: 0 0 14px #4f8cff;
    }

    .active {
      background-color: #e04440 !important;
      border-color: #ff7777 !important;
      color: white !important;
      box-shadow: 0 0 30px rgba(255, 70, 70, 0.9);
      animation: pulse 0.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    .result-box {
      width: 100%;
      max-width: 460px;
      padding: 24px 28px;
      background-color: #1f1f1f;
      border-left: 6px solid #79ffc2;
      border-radius: 10px;
      font-size: 18px;
      line-height: 1.8;
      box-shadow: 0 10px 22px rgba(0,0,0,0.35);
      display: none;
      box-sizing: border-box;
      margin-bottom: 25px;
    }

    .result-box span {
      color: #79ffc2;
      font-weight: bold;
      font-size: 22px;
    }

    .right-panel {
      width: 100%;
      max-width: 520px;
      background-color: #1f1f1f;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.35);
      box-sizing: border-box;
    }

    .right-panel h2 {
      font-size: 22px;
      color: #79ffc2;
      margin: 0 0 16px 0;
      border-bottom: 1px solid #333;
      padding-bottom: 12px;
    }

    .table-wrapper {
      max-height: 310px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .table-wrapper::-webkit-scrollbar { width: 6px; }
    .table-wrapper::-webkit-scrollbar-track { background: #1e1e1e; }
    .table-wrapper::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    .table-wrapper::-webkit-scrollbar-thumb:hover { background: #666; }

    .log-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
      text-align: left;
    }

    .log-table th {
      color: #999;
      font-weight: 600;
      padding: 10px 0;
      border-bottom: 2px solid #333;
      position: sticky;
      top: 0;
      background-color: #1f1f1f;
      z-index: 1;
    }

    .log-table td {
      padding: 11px 0;
      border-bottom: 1px solid #2a2a2a;
      color: #ccc;
    }

    .log-table tr:first-child td {
      color: #ff7777;
      font-weight: bold;
    }

    .debug-box {
      width: 100%;
      max-width: 720px;
      margin-top: 26px;
      padding: 14px 18px;
      background: #181818;
      border: 1px solid #333;
      border-radius: 8px;
      color: #999;
      font-size: 14px;
      word-break: break-all;
      box-sizing: border-box;
    }

    .ok { color: #79ffc2; }
    .err { color: #ff7777; }

    @media (max-width: 768px) {
      h1 { font-size: 30px; }
      .grid-container {
        grid-template-columns: repeat(3, 90px);
        grid-template-rows: repeat(2, 90px);
        padding: 22px;
        gap: 16px;
      }
      .zone { font-size: 22px; }
      .result-box, .right-panel { max-width: 465px; }
    }
  </style>
</head>

<body>
  <h1>🚨 AI 층간소음 진원지 레이더</h1>
  <p>150cm x 100cm 실시간 관제 및 로그 시스템</p>

  <div class="main-container">
    <div class="grid-container">
      <div id="z1" class="zone">P1<div class="node-marker"></div></div>
      <div id="z2" class="zone">P2</div>
      <div id="z3" class="zone">P3<div class="node-marker"></div></div>
      <div id="z4" class="zone">P4<div class="node-marker"></div></div>
      <div id="z5" class="zone">P5</div>
      <div id="z6" class="zone">P6<div class="node-marker"></div></div>
    </div>

    <div id="resultBox" class="result-box">
      📍 진원지: <span id="resZone">P-</span> 구역<br>
      🔊 소음원: <span id="resSound">대기 중</span><br>
      🎯 정확도: <span id="resAcc">0</span>%<br>
      🧩 클래스: <span id="resClass">-</span>
    </div>

    <div class="right-panel">
      <h2>📋 누적 발생 이력 로그</h2>
      <div class="table-wrapper">
        <table class="log-table">
          <thead>
            <tr>
              <th width="30%">시간</th>
              <th width="20%">위치</th>
              <th width="50%">소음 종류</th>
            </tr>
          </thead>
          <tbody id="logBody"></tbody>
        </table>
      </div>
    </div>

    <div id="debugBox" class="debug-box">Firebase REST 연결 대기 중...</div>
  </div>

  <script>
    const DB_URL = "https://noiseradar-8886e-default-rtdb.firebaseio.com";
    const STATUS_URL = DB_URL + "/current_status.json";

    const debugBox = document.getElementById("debugBox");
    const logBody = document.getElementById("logBody");

    let lastTimestamp = 0;

    function setDebug(msg, isError) {
      debugBox.className = isError ? "debug-box err" : "debug-box ok";
      debugBox.innerText = msg;
      console.log(msg);
    }

    function clearZones() {
      for (let i = 1; i <= 6; i++) {
        document.getElementById("z" + i).classList.remove("active");
      }
    }

    function addLog(data) {
      if (!data || Number(data.zone) <= 0) return;

      const ts = Number(data.timestamp || Date.now());
      if (ts === lastTimestamp) return;
      lastTimestamp = ts;

      const timeString = data.timeText || new Date().toLocaleTimeString("ko-KR", {
        hour12: false,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });

      const sound = data.sound || data.noise || data.noiseType || "-";
      const acc = data.accuracy ?? data.confidence ?? 0;

      const row = document.createElement("tr");
      row.innerHTML =
        "<td>" + timeString + "</td>" +
        "<td><b style='color:#79ffc2;'>P" + data.zone + "</b></td>" +
        "<td>" + sound + " (" + acc + "%)</td>";

      logBody.insertBefore(row, logBody.firstChild);
    }

    function renderStatus(data) {
      clearZones();

      if (data && Number(data.zone) > 0) {
        const zone = Number(data.zone);
        const zoneEl = document.getElementById("z" + zone);

        if (zoneEl) zoneEl.classList.add("active");

        document.getElementById("resZone").innerText = "P" + zone;
        document.getElementById("resSound").innerText = data.sound || data.noise || data.noiseType || "-";
        document.getElementById("resAcc").innerText = data.accuracy ?? data.confidence ?? 0;
        document.getElementById("resClass").innerText = data.class_id || data.label || "-";
        document.getElementById("resultBox").style.display = "block";

        addLog(data);
      } else {
        document.getElementById("resultBox").style.display = "none";
      }
    }

    async function pollStatus() {
      try {
        const res = await fetch(STATUS_URL + "?t=" + Date.now(), {
          cache: "no-store"
        });

        if (!res.ok) {
          const txt = await res.text();
          setDebug("Firebase REST 읽기 실패: HTTP " + res.status + " / " + txt, true);
          return;
        }

        const data = await res.json();

        setDebug("current_status 수신: " + JSON.stringify(data), false);
        renderStatus(data);

      } catch (err) {
        setDebug("Firebase REST 연결 오류: " + err.message, true);
      }
    }

    pollStatus();
    setInterval(pollStatus, 1000);
  </script>
</body>
</html>
